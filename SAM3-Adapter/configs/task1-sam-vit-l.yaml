train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/task1/test/img
      root_path_2: ./load/task1/test/gt
      cache: none
  wrapper:
    name: val
    args:
      inp_size: 1008
  batch_size: 32

val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/task1/test/img
      root_path_2: ./load/task1/test/gt
      cache: none
  wrapper:
    name: val
    args:
      inp_size: 1008
  batch_size: 32

test_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ./load/task1/test/img
      root_path_2: ./load/task1/test/gt
      cache: none
  wrapper:
    name: val
    args:
      inp_size: 1008
  batch_size: 32

eval_type: kvasir
sam_checkpoint: <PATH_TO_SAM3_CHECKPOINT>/sam3.pt

data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
  gt_rgb:
    sub:
    - 0.5
    div:
    - 0.5

model:
  name: sam
  args:
    inp_size: 1008
    loss: iou
    encoder_mode:
      name: sam
      stages: [2, 6, 36, 4]
      global_att_blocks: [23, 33, 43]
      window_pos_embed_bkg_spatial_size: [7, 7]
      window_spec: [8, 4, 16, 8]
      num_pos_feats: 256
      normalize: true
      scale: null
      temperature: 10000
      d_model: 256
      backbone_channel_list: [1152, 576, 288, 144]
      fpn_top_down_levels: [2, 3]
      fpn_interp_model: nearest
      img_size: 1008
      mlp_ratio: 4
      patch_size: 14
      qkv_bias: true
      use_rel_pos: true
      window_size: 14
      out_chans: 256
      scale_factor: 32
      input_type: fft
      freq_nums: 0.25
      prompt_type: highpass
      prompt_embed_dim: 256
      tuning_stage: 1234
      handcrafted_tune: true
      embedding_tune: true
      adaptor: adaptor
      embed_dim: 144
      depth: 32
      num_heads: 2
      global_attn_indexes:
      - 7
      - 15
      - 23
      - 31

optimizer:
  name: adamw
  args:
    lr: 0.0002
lr_min: 1.0e-7
epoch_max: 80

multi_step_lr:
  milestones:
  - 1
  gamma: 0.1
epoch_val: 1
epoch_save: 1
