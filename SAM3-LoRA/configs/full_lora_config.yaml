# SAM3 LoRA Training Configuration

model:
  name: "facebook/sam3"
  cache_dir: null

lora:
  rank: 8                  # Increased from 8 — more capacity for MRI domain adaptation
  alpha: 16                 # 2x rank
  dropout: 0.2              # Increased from 0.1 — stronger regularization to reduce overfitting

  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "qkv"
    - "proj"
    - "fc1"
    - "fc2"
    - "c_fc"
    - "c_proj"
    - "linear1"
    - "linear2"

  # Vision encoder ON — MRI domain is very different from natural images,
  # the vision backbone must adapt to grayscale cardiac MRI features
  apply_to_vision_encoder: true
  apply_to_text_encoder: true    # Text encoder understands "left atrium" already
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true

training:
  data_dir: "./data_v2"   # patient-wise split, no leakage
  query_text_map:
    "left atrium": "Segment the left atrium in cardiac MRI of the heart"
  batch_size: 2             # all encoders enabled needs more memory
  num_workers: 2

  learning_rate: 5e-6       # very low LR — 9.2M params needs much smaller steps
  weight_decay: 0.1         # stronger regularization
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0

  num_epochs: 30
  early_stopping_patience: 10
  warmup_steps: 500         # ~1 epoch warmup for new larger dataset
  lr_scheduler: "cosine"

  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 5

  mixed_precision: "bf16"
  seed: 42
  gradient_accumulation_steps: 8

output:
  output_dir: "outputs/sam3_lora_full"
  logging_dir: "logs"
  save_lora_only: true
  push_to_hub: false
  hub_model_id: null

evaluation:
  metric: "iou"
  save_predictions: false
  compute_metrics_during_training: true

hardware:
  device: "cuda"
  dataloader_pin_memory: true
  use_compile: false
